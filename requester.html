<!DOCTYPE html>
<html>
    <head>
        <title>Requester</title>
    </head>
    <body>
        <h1>Isabella Mills uses a fetch request</h1>

        <input type="number" id="x"> <br>
        <input type="number" id="y"> <br>
        <button name="Invoke computation on Server" onclick="getResult()">Invoke computation on Server</button>

        <div id="result">
            <p>Result will appear here.</p>
        </div>
    </body>
    <script>
        function getResult() {
            const x = document.getElementById("x").value
            const y = document.getElementById("y").value
            const result = document.getElementById("result")

            const url = new URL("http://127.0.0.1:3001/")
            url.searchParams.set("x", x)
            url.searchParams.set("y", y)

            fetch(url)
                .then(response => response.text())
                .then(text => {
                    result.innerHTML = `<p>${text}</p>`
                })
                .catch(error => {
                    result.innerHTML = `<p>Error: ${error.message}</p>`
                })
        }
    </script>
</html>
